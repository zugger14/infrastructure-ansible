---
# ==============================================================================
# Global Infrastructure Configuration
# ==============================================================================
app_user: "ec2-user"
app_base_dir: "/home/{{ app_user }}"

# Swap configuration (essential for 1GB t3.micro memory stability)
swap_size_mb: 2048
swap_file_path: "/swapfile"

# Nginx reverse proxy configuration paths
nginx_conf_dir: "/etc/nginx"
nginx_confd_dir: "{{ nginx_conf_dir }}/conf.d"
nginx_defaultd_dir: "{{ nginx_conf_dir }}/default.d"

# ==============================================================================
# Applications Declaration (Fully DRY & Config-Driven)
#
# To add any new app in the future, just append another item to this list:
#   - name: "myapp"
#     repo_url: "https://github.com/youruser/myapp.git"
#     version: "main"                 # optional: branch/tag/commit (default: main)
#     service_port: 5000              # internal container port forwarded to host
#     subdomain: "myapp"              # optional: subdomain prefix (default: app name)
#     direct_port: 8090               # optional: direct public port (e.g. :8090)
#     client_max_body_size: "50M"     # optional: default is 50M
#     websocket_port: 6001            # optional: if the app requires websockets
#     websocket_path: "/ws"           # optional: default is /socket.io/
# ==============================================================================
applications:
  - name: "devops-portfolio"
    repo_url: "https://github.com/zugger14/devops-portfolio.git"
    version: "main"
    service_port: 3000
    is_default_app: true              # Serves root http://<IP>/ directly

  - name: "ams"
    repo_url: "https://github.com/zugger14/ams.git"
    version: "main"
    service_port: 8081
    subdomain: "ams"
    direct_port: 8080
    client_max_body_size: "50M"

  - name: "musicbook"
    repo_url: "https://github.com/zugger14/musicbook.git"
    version: "main"
    service_port: 8001
    subdomain: "musicbook"
    direct_port: 8000
    websocket_port: 8890
    websocket_path: "/socket.io/"
    client_max_body_size: "100M"

  - name: "mindflow"
    repo_url: "https://github.com/zugger14/mindflow.git"
    version: "main"
    service_port: 3020
    subdomain: "mindflow"
    direct_port: 3020
    client_max_body_size: "50M"

