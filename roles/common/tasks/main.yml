---
- name: Ensure required base packages are installed
  become: true
  ansible.builtin.package:
    name:
      - git
      - tar
      - procps-ng
    state: present

- name: Check if swapfile exists
  become: true
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_stat

- name: Create swap file if missing
  become: true
  ansible.builtin.command: "dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_size_mb }}"
  when:
    - not swap_stat.stat.exists
    - ansible_virtualization_type | default('') not in ['docker', 'container']
  changed_when: true

- name: Set permissions on swap file
  become: true
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: '0600'
  when: ansible_virtualization_type | default('') not in ['docker', 'container']

- name: Format swap file
  become: true
  ansible.builtin.command: "mkswap {{ swap_file_path }}"
  when:
    - not swap_stat.stat.exists
    - ansible_virtualization_type | default('') not in ['docker', 'container']
  changed_when: true

- name: Enable swap
  become: true
  ansible.builtin.command: "swapon {{ swap_file_path }}"
  when:
    - not swap_stat.stat.exists
    - ansible_virtualization_type | default('') not in ['docker', 'container']
  changed_when: true

- name: Ensure swap is persisted in /etc/fstab
  become: true
  ansible.posix.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    state: present
  when: ansible_virtualization_type | default('') not in ['docker', 'container']
